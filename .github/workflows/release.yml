name: Publish verified VoidedClient release

on:
  push:
    tags:
      - client-v*

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore wrapper executable bit
        run: chmod +x gradlew

      - name: Audit runtime source
        run: bash scripts/security-audit.sh

      - name: Scan repository for committed secrets
        run: bash scripts/secret-scan.sh

      - name: Build clean release artifacts
        run: ./gradlew --no-daemon --stacktrace clean :fabric:build :forge:build

      - name: Generate SHA-256 checksums
        run: bash scripts/create-checksums.sh

      - name: Collect release files
        run: |
          mkdir -p release
          find fabric/build/libs forge/build/libs -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-dev.jar' -exec cp {} release/ \;
          cp SHA256SUMS.txt release/

      - name: Attest release provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: release/*

      - name: Create immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; refusing to replace published artifacts." >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "VoidedClient ${GITHUB_REF_NAME#client-v}"
          gh release upload "$GITHUB_REF_NAME" release/*

      - name: Upload CI archive
        uses: actions/upload-artifact@v4
        with:
          name: VoidedClient-${{ github.ref_name }}
          if-no-files-found: error
          retention-days: 90
          path: release/*
