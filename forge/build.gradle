plugins { id 'net.minecraftforge.gradle' version '[7.0.17,8)' }

base { archivesName = 'VoidedClient-Forge-26.2' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation project(':common')
}

def resolvedModVersion = rootProject.version.toString()
def resolvedMinecraftVersion = minecraft_version.toString()

processResources {
    inputs.property 'version', resolvedModVersion
    inputs.property 'minecraft_version', resolvedMinecraftVersion
    filesMatching('META-INF/mods.toml') {
        expand 'version': resolvedModVersion, 'minecraft_version': resolvedMinecraftVersion
    }
}

tasks.named('jar') { from project(':common').sourceSets.main.output }
