plugins { id 'net.fabricmc.fabric-loom' version "${fabric_loom_version}" }

base { archivesName = 'VoidedClient-Fabric-26.2' }
java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

repositories { maven { url = 'https://maven.fabricmc.net/' } }

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    implementation project(':common')
}

def resolvedModVersion = rootProject.version.toString()
def resolvedMinecraftVersion = minecraft_version.toString()

processResources {
    inputs.property 'version', resolvedModVersion
    inputs.property 'minecraft_version', resolvedMinecraftVersion
    filesMatching('fabric.mod.json') {
        expand 'version': resolvedModVersion, 'minecraft_version': resolvedMinecraftVersion
    }
}

tasks.named('jar') { from project(':common').sourceSets.main.output }
